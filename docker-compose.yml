version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishing-detection-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - ALLOWED_HOSTS=localhost,frontend
    volumes:
      - ./backend:/app
    networks:
      - phishing-detection-network
    restart: unless-stopped
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishing-detection-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - phishing-detection-network
    restart: unless-stopped

networks:
  phishing-detection-network:
    driver: bridge
